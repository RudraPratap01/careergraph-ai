<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">CareerGraph AI system architecture</title>
  <desc id="archDesc">A React frontend calls a FastAPI backend with JWT authentication. Deterministic services handle profiles, resumes, readiness, roadmaps, evidence and mentorship. PostgreSQL or SQLite stores application records; the skill graph uses an in-memory backend by default with an optional Neo4j adapter. The grounded advisor retrieves curated excerpts with local BM25, returns a deterministic extractive answer, and can optionally send minimal context to OpenRouter. A citation and link validator decides whether an LLM answer is accepted or replaced by the deterministic fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d19"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="advisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171c3a"/>
      <stop offset="1" stop-color="#10182d"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowOpt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/>
    </marker>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#16223b" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="1280" height="820" fill="url(#bg)"/>
  <rect width="1280" height="820" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1130" cy="120" r="210" fill="#7c3aed" opacity="0.08"/>
  <circle cx="280" cy="740" r="230" fill="#0891b2" opacity="0.06"/>

  <text x="40" y="44" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">CareerGraph AI</text>
  <text x="40" y="68" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5">Implemented system architecture  ·  solid = local/default path  ·  amber dashed = optional external path</text>
  <rect x="1050" y="30" width="190" height="38" rx="10" fill="#0f1a2f" stroke="#293755"/>
  <circle cx="1070" cy="49" r="4" fill="#34d399"/>
  <text x="1082" y="53" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">CI verified | no hosted demo</text>

  <!-- User, frontend, API -->
  <rect x="40" y="110" width="150" height="88" rx="12" fill="#10192c" stroke="#2a3958"/>
  <text x="58" y="136" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">USER</text>
  <text x="58" y="160" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Student / alumni</text>
  <text x="58" y="180" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Browser session</text>

  <rect x="230" y="100" width="220" height="108" rx="12" fill="#111b30" stroke="#33476b"/>
  <text x="248" y="126" fill="#22d3ee" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">REACT FRONTEND</text>
  <text x="248" y="149" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Vite SPA</text>
  <text x="248" y="170" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Role-aware routes, forms,</text>
  <text x="248" y="187" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">loading/empty/error states</text>

  <rect x="490" y="100" width="250" height="108" rx="12" fill="#111b30" stroke="#33476b"/>
  <text x="508" y="126" fill="#22d3ee" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">FASTAPI API</text>
  <text x="508" y="149" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">JWT + Pydantic</text>
  <text x="508" y="170" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">bcrypt passwords · role checks</text>
  <text x="508" y="187" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">ownership-scoped resources</text>

  <line x1="190" y1="154" x2="230" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="154" x2="490" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="192" y="145" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">HTTP</text>
  <text x="452" y="145" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">/api + JWT</text>

  <!-- Services -->
  <text x="40" y="276" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DETERMINISTIC APPLICATION SERVICES</text>
  <rect x="40" y="288" width="700" height="220" rx="14" fill="#0f172a" stroke="#253552"/>
  <line x1="615" y1="208" x2="615" y2="288" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="314" width="320" height="82" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="76" y="338" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Profiles &amp; resumes</text>
  <text x="76" y="358" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Deterministic taxonomy extraction; student review</text>
  <text x="76" y="375" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">preserves self / assessment / GitHub provenance</text>

  <rect x="400" y="314" width="320" height="82" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="416" y="338" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Skill gaps &amp; readiness</text>
  <text x="416" y="358" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Weighted coverage of curated required skills</text>
  <text x="416" y="375" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Explainable contributions; not a hiring probability</text>

  <rect x="60" y="408" width="320" height="82" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="76" y="432" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Roadmaps &amp; skill graph</text>
  <text x="76" y="452" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Bounded traversal, cycle checks, deterministic</text>
  <text x="76" y="469" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">topological order; progress stored separately</text>

  <rect x="400" y="408" width="320" height="82" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="416" y="432" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="600">Evidence &amp; mentorship</text>
  <text x="416" y="452" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Curated assessments, public GitHub metadata,</text>
  <text x="416" y="469" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">ranked alumni and party-scoped requests</text>

  <!-- Data -->
  <text x="40" y="546" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">DATA &amp; KNOWLEDGE LAYER</text>
  <rect x="40" y="558" width="700" height="190" rx="14" fill="#0f172a" stroke="#253552"/>
  <line x1="245" y1="508" x2="245" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="508" x2="535" y2="558" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="255" y="534" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">persists / reads</text>

  <rect x="60" y="580" width="212" height="146" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="76" y="604" fill="#a78bfa" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">RELATIONAL STORE</text>
  <text x="76" y="627" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">PostgreSQL / SQLite</text>
  <text x="76" y="648" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">PostgreSQL 16 for shared</text>
  <text x="76" y="665" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">deployments; SQLite for local</text>
  <text x="76" y="682" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">development. Alembic schema.</text>
  <text x="76" y="705" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">users · profiles · resumes ·</text>
  <text x="76" y="719" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">roadmaps · evidence · requests</text>

  <rect x="288" y="580" width="212" height="146" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="304" y="604" fill="#22d3ee" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SKILL GRAPH</text>
  <text x="304" y="627" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">In-memory / Neo4j</text>
  <text x="304" y="648" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">In-memory backend by default;</text>
  <text x="304" y="665" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">optional Neo4j 5 adapter with</text>
  <text x="304" y="682" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">the same traversal algorithms.</text>
  <text x="304" y="705" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">curated prerequisite edges</text>

  <rect x="516" y="580" width="204" height="146" rx="10" fill="#121d33" stroke="#2b3b5b"/>
  <text x="532" y="604" fill="#fbbf24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">CURATED KNOWLEDGE</text>
  <text x="532" y="627" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">In-repo data</text>
  <text x="532" y="648" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">Taxonomy, occupations, skills,</text>
  <text x="532" y="665" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">prerequisites and assessments.</text>
  <text x="532" y="682" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">Advisor corpus: 94 docs /</text>
  <text x="532" y="699" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">102 lexical chunks.</text>

  <!-- Advisor panel -->
  <rect x="790" y="100" width="450" height="648" rx="16" fill="url(#advisor)" stroke="#4c3f86"/>
  <rect x="790" y="100" width="450" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="812" y="132" fill="#c4b5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">GROUNDED CAREER ADVISOR</text>
  <text x="812" y="157" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Retrieval + validation</text>
  <text x="812" y="177" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11">The question is the retrieval query; profile context is added separately.</text>
  <line x1="740" y1="154" x2="790" y2="154" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="812" y="196" width="406" height="48" rx="9" fill="#1b2344" stroke="#3c4d78"/>
  <text x="828" y="216" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Question</text>
  <text x="828" y="232" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">no resume text, email, name, account ID or token</text>

  <line x1="1015" y1="244" x2="1015" y2="266" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="812" y="266" width="406" height="54" rx="9" fill="#1b2344" stroke="#3c4d78"/>
  <text x="828" y="286" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Local BM25 retrieval</text>
  <text x="828" y="305" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">curated corpus · top-k 6 · score threshold · taxonomy aliases</text>

  <line x1="1015" y1="320" x2="1015" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="812" y="340" width="406" height="50" rx="9" fill="#1b2344" stroke="#3c4d78"/>
  <text x="828" y="360" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Retrieved excerpts [S1] … [S6]</text>
  <text x="828" y="377" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">source metadata stays attached to the answer</text>

  <path d="M 905 390 L 905 410" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1115 390 L 1115 410" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpt)"/>
  <rect x="812" y="410" width="190" height="102" rx="9" fill="#12233a" stroke="#34d399"/>
  <text x="826" y="431" fill="#34d399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">DETERMINISTIC PATH</text>
  <text x="826" y="450" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">Extractive answer</text>
  <text x="826" y="469" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">always available; same</text>
  <text x="826" y="484" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">retrieval + citations</text>
  <text x="826" y="501" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">mode=grounded_extractive</text>

  <rect x="1030" y="410" width="190" height="102" rx="9" fill="#1f1a2f" stroke="#fbbf24" stroke-dasharray="6 4"/>
  <text x="1044" y="431" fill="#fbbf24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700">OPTIONAL PATH</text>
  <text x="1044" y="450" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600">OpenRouter model</text>
  <text x="1044" y="469" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">backend-only key;</text>
  <text x="1044" y="484" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">minimal context only</text>
  <text x="1044" y="501" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">disabled when key is blank</text>

  <path d="M 905 512 L 905 530" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1115 512 L 1115 530" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpt)"/>
  <rect x="1030" y="530" width="190" height="60" rx="9" fill="#1f1a2f" stroke="#fbbf24" stroke-dasharray="6 4"/>
  <text x="1044" y="550" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Citation + link check</text>
  <text x="1044" y="568" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">valid [S#] required; no URLs</text>
  <text x="1044" y="582" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10">20–3000 chars; else fallback</text>

  <path d="M 1030 574 L 1000 574 L 1000 512" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowOpt)"/>
  <text x="925" y="575" fill="#fbbf24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">invalid / timeout</text>
  <text x="925" y="587" fill="#fbbf24" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">→ fallback</text>

  <rect x="812" y="624" width="406" height="62" rx="9" fill="#171d3b" stroke="#6d5bb8"/>
  <text x="828" y="645" fill="#f1f5f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Answer + visible source cards</text>
  <text x="828" y="663" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">mode, fallback notice and limitations are explicit; scores unchanged</text>
  <path d="M 905 512 L 905 624" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1115 590 L 1115 624" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowOpt)"/>

  <text x="40" y="790" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5">Readiness is weighted coverage of curated required skills, not a probability of employment. Live OpenRouter generation is not claimed without a configured key.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">CareerGraph AI</title>
  <desc id="bannerDesc">CareerGraph AI banner with the slogan: Know your gap. Build your path. Meet your mentor.</desc>
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c17"/>
      <stop offset="0.55" stop-color="#0c1324"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="bannerAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="bannerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bannerGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#18253d" stroke-width="0.55"/>
    </pattern>
    <filter id="bannerGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bannerBg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#bannerGrid)" opacity="0.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="258.5" rx="18" fill="none" stroke="#293753"/>
  <circle cx="1060" cy="60" r="220" fill="url(#bannerGlow)"/>

  <rect x="60" y="70" width="64" height="64" rx="18" fill="#151d38" stroke="#4c3f86"/>
  <g transform="translate(74 84) scale(2.25)" fill="none" stroke="url(#bannerAccent)" stroke-width="1.5" stroke-linecap="round">
    <path d="M 2 4 L 8 11 L 15 3"/>
    <circle cx="2" cy="4" r="1.5" fill="#a78bfa" stroke="none"/>
    <circle cx="8" cy="11" r="1.5" fill="#22d3ee" stroke="none"/>
    <circle cx="15" cy="3" r="1.5" fill="#a78bfa" stroke="none"/>
  </g>
  <text x="145" y="99" fill="#a5b4fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">CAREER INTELLIGENCE</text>
  <text x="144" y="139" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.8">CareerGraph AI</text>
  <text x="145" y="172" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">Know your gap. Build your path. Meet your mentor.</text>
  <text x="145" y="205" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5">Deterministic readiness  ·  prerequisite-ordered roadmaps  ·  cited career guidance  ·  mentor matching</text>

  <g opacity="0.95">
    <path d="M 864 187 C 926 158 956 105 1018 93 C 1080 81 1108 116 1140 85" fill="none" stroke="#3b4b70" stroke-width="1.3" stroke-dasharray="4 5"/>
    <path d="M 864 187 L 932 146 L 1002 160 L 1072 108 L 1140 85" fill="none" stroke="url(#bannerAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="864" cy="187" r="7" fill="#0c1324" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="932" cy="146" r="7" fill="#0c1324" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="1002" cy="160" r="7" fill="#0c1324" stroke="#a78bfa" stroke-width="2.5"/>
    <circle cx="1072" cy="108" r="7" fill="#0c1324" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="1140" cy="85" r="10" fill="#171d3b" stroke="#34d399" stroke-width="2.5" filter="url(#bannerGlowFilter)"/>
    <text x="852" y="211" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">SKILLS</text>
    <text x="917" y="132" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">GAPS</text>
    <text x="990" y="182" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">PATH</text>
    <text x="1056" y="95" fill="#64748b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5">EVIDENCE</text>
    <text x="1114" y="70" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="600">NEXT STEP</text>
  </g>
</svg>

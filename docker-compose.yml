version: "3.9"

# CareerGraph AI — Docker Compose
# Starts: PostgreSQL, Neo4j (databases only)
# The FastAPI backend runs locally via: uvicorn app.main:app --reload
# The React frontend runs locally via: npm run dev
#
# To start databases:
#   docker compose up -d
#
# To stop:
#   docker compose down
#
# To wipe all data:
#   docker compose down -v

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: careergraph_postgres
    environment:
      POSTGRES_DB: careergraph_db
      POSTGRES_USER: careergraph
      POSTGRES_PASSWORD: careergraph_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careergraph -d careergraph_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ──────────────────────────────────────────────────────────────────
  # Used in Phase 6 for skill dependency graphs.
  # Accessible at:
  #   Browser: http://localhost:7474
  #   Bolt:    bolt://localhost:7687
  neo4j:
    image: neo4j:5.24-community
    container_name: careergraph_neo4j
    environment:
      NEO4J_AUTH: neo4j/careergraph-neo4j-dev
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt protocol (used by Python driver)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:

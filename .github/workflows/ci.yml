name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest + migrations)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify migrations match the models
        env:
          DATABASE_URL: sqlite:///./ci_verify.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  integration:
    name: Live PostgreSQL + Neo4j integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careergraph_test
          POSTGRES_USER: careergraph
          POSTGRES_PASSWORD: careergraph_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careergraph -d careergraph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5.24-community
        env:
          NEO4J_AUTH: neo4j/ci-only-neo4j-password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-neo4j-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Apply migrations to disposable PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg2://careergraph:careergraph_test_password@localhost:5432/careergraph_test
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: PostgreSQL integration tests
        env:
          POSTGRES_TEST_URL: postgresql+psycopg2://careergraph:careergraph_test_password@localhost:5432/careergraph_test
        run: python -m pytest -q tests/test_postgres_integration.py

      - name: Neo4j integration tests
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USER: neo4j
          NEO4J_TEST_PASSWORD: ci-only-neo4j-password
          NEO4J_TEST_ALLOW_WRITE: "true"
        run: python -m pytest -q tests/test_neo4j_integration.py
